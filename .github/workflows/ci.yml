name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 1. Creating the database (Using safe dummy password for CI)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: actions_test_pass
          MYSQL_DATABASE: sunrise_dental
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pactions_test_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        env:
          DB_PASSWORD: actions_test_pass
        run: mvn test