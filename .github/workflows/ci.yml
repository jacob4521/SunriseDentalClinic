name: Java CI with Maven

# The trigger of when this should run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # GitHub Runner

    # 1. Creating the database
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
          MYSQL_DATABASE: sunrise_dental
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -p${{ secrets.DB_TEST_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 2. Getting the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Installing Java
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 4. Running the tests
      - name: Run Maven Tests
        env:
          DB_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
        run: mvn test